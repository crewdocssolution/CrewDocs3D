<!doctype html><html lang='ru'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Crew Docs 3D</title><style>body{margin:0;background:#061727;color:white;font-family:system-ui}header{padding:24px;position:absolute;z-index:2}main{height:100vh;display:grid;place-items:center;text-align:center;position:relative}section{z-index:1;padding:20px}h1{font-size:clamp(42px,8vw,90px);margin:0}p{color:#b6d9e6}a{color:#75e5f3}canvas{position:absolute;inset:0;width:100%;height:100%}</style><header><b>CREW DOCS / 3D</b></header><main><canvas id='c'></canvas><section><h1>BEYOND THE HORIZON</h1><p>Морские документы. Новый цифровой опыт.</p><a href='https://t.me/my_crewdocs_manager'>Связаться с менеджером ↗</a></section></main><script type='module'>import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';const s=new T.Scene(),c=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000),r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));s.add(new T.HemisphereLight(0x88eeff,0x123355,3));let g=new T.PlaneGeometry(130,130,70,70);g.rotateX(-Math.PI/2);let m=new T.Mesh(g,new T.MeshStandardMaterial({color:0x08718b,metalness:.7,roughness:.25,flatShading:true}));s.add(m);c.position.set(0,12,23);c.lookAt(0,0,0);let p=g.attributes.position;function draw(t){t*=.001;for(let i=0;i<p.count;i++){let x=p.getX(i),z=p.getZ(i);p.setY(i,Math.sin(x*.3+t)*.65+Math.cos(z*.25+t*.8)*.6)}p.needsUpdate=true;g.computeVertexNormals();r.render(s,c);requestAnimationFrame(draw)}requestAnimationFrame(draw);onresize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}</script></html>
